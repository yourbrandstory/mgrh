document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: translate3d(-78px,-26px,0) scale(1.26); } 50% { transform: translate3d(-104px,18px,0) scale(1.2); } 75% { transform: translate3d(-42px,38px,0) scale(1.26); } 100% { transform: translate3d(0,0,0) scale(1.2); } }\n    @keyframes mgBloom { 0%, 100% { opacity: 0.5; transform: translate3d(0,0,0) scale(1); } 50% { opacity: 0.85; transform: translate3d(20px,12px,0) scale(1.12); } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'DM Sans', sans-serif; color: #1F3A34; background: #ffffff;\">\n\n  <!-- ===== TOP UTILITY BAND ===== -->\n  <div style=\"background: #2AA5AE; color: #E4F5F6;\">\n    <div style=\"max-width: 1800px; margin: 0 auto; padding: 10px 26px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-size: 17.5px;\">\n      <div style=\"display: flex; align-items: center; gap: 28px; flex-wrap: wrap;\">\n        <span style=\"display: inline-flex; align-items: center; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CFEDEF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.6\"><\u002Fcircle><\u002Fsvg>\n          Mahabaleshwar - Medha Road, District - Satara – 412 806, Maharashtra\n        <\u002Fspan>\n        <span style=\"display: inline-flex; align-items: center; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CFEDEF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7.5V12l3.4 2\"><\u002Fpath><\u002Fsvg>\n          OPD 9:00 – 17:00 · Casualty open 24 hours\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n        <span style=\"display: inline-flex; align-items: center; gap: 9px; color: #ffffff; font-weight: 600;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CFEDEF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v3a1 1 0 0 1-1 1A16 16 0 0 1 3 5a1 1 0 0 1 1-1Z\"><\u002Fpath><\u002Fsvg>\n          <a href=\"tel:+912168260247\" style=\"color: #ffffff;\">+91 21682 60247<\u002Fa>\n        <\u002Fspan>\n        <span style=\"display: inline-flex; align-items: center; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CFEDEF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3.5 6.5 12 13l8.5-6.5\"><\u002Fpath><\u002Fsvg>\n          <a href=\"mailto:info@mgrh-mahabaleshwar.org\" style=\"color: #F0FAFB;\">info@mgrh-mahabaleshwar.org<\u002Fa>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== HEADER ===== -->\n  <header ref=\"{{ headerRef }}\" style=\"position: sticky; top: 0; z-index: 60; background: #ffffff; border-bottom: 1px solid #E6ECEA;\">\n    <div style=\"max-width: 1800px; margin: 0 auto; padding: 14px 26px; display: flex; align-items: center; justify-content: space-between; gap: 24px;\">\n      <img src=\"0f25a0a1-438c-45fe-9535-20a99d79ee16\" alt=\"Morarji Gokuldas Rural Hospital\" style=\"height: 140px; width: auto; display: block;\">\n      <nav style=\"flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 0;\">\n        <div style=\"flex: 0 1 auto; min-width: 0; margin-left: auto; display: flex; align-items: center; justify-content: flex-start; gap: 0; overflow-x: auto; scrollbar-width: none;\">\n          <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n            <a href=\"{{ n.href }}\" style=\"flex: none; font-weight: 500; font-size: 26px; padding: 9px 15px; border-radius: 6px; color: {{ n.color }}; cursor: pointer; white-space: nowrap; text-decoration: none;\" style-hover=\"color: #06A88C;\">{{ n.label }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <a href=\"tel:+912168260247\" style=\"flex: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 23px; margin-left: 12px; background: #E1332A; color: #fff; padding: 11px 18px; border-radius: 6px; white-space: nowrap;\" style-hover=\"background: #C42A21; color: #fff;\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"><\u002Fcircle><path d=\"M12 7.5v6M12 16.6v.4\"><\u002Fpath><\u002Fsvg>\n          Emergency\n        <\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===== HERO ===== -->\n  <section style=\"position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; z-index: 0; background: linear-gradient(100deg, #10A08A 0%, #14A695 34%, #1BAAA8 66%, #2BB2C4 100%);\"><\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; z-index: 1; overflow: hidden;\">\n      <img src=\"42f31b82-e08b-45b0-a825-2b0139a105c3\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block;\">\n    <\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; z-index: 2; background: linear-gradient(90deg, rgba(3,96,84,0.93) 0%, rgba(4,110,100,0.82) 38%, rgba(10,140,140,0.38) 68%, rgba(69,184,204,0.08) 100%);\"><\u002Fdiv>\n    <div style=\"position: absolute; z-index: 2; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 68%); animation: mgBloom 18s ease-in-out infinite;\"><\u002Fdiv>\n\n    <div style=\"position: relative; z-index: 4; max-width: 1800px; margin: 0 auto; padding: 52px 26px 84px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 56px; align-items: end;\">\n        <div style=\"max-width: 700px;\">\n          <div style=\"display: flex; align-items: center; gap: 9px; font-size: 17px; letter-spacing: 0.12em; font-weight: 500; text-transform: uppercase; color: rgba(255,255,255,0.72); margin-bottom: 20px; flex-wrap: wrap;\">\n            <span style=\"cursor: pointer;\">Home<\u002Fspan><span style=\"opacity: 0.5;\">/<\u002Fspan>\n            <span style=\"color: rgba(255,255,255,0.6);\">Doctors<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28); color: #EAF7F4; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 15px; border-radius: 999px; margin-bottom: 20px;\">\n            <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #C7EDE6;\"><\u002Fspan>\n            Run by professionals\n          <\u002Fdiv>\n          <h1 style=\"font-weight: 500; font-size: 66px; line-height: 1.02; margin: 0 0 20px; color: #ffffff; letter-spacing: -0.025em;\">Our <span style=\"font-weight: 700;\">Medical Team<\u002Fspan><\u002Fh1>\n          <p style=\"font-size: 24px; line-height: 1.6; color: rgba(255,255,255,0.92); margin: 0; max-width: 780px;\">Meet our resident medical officers and visiting specialists providing clinical care across the hospital's departments.<\u002Fp>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== INTRODUCTION ===== -->\n  <section style=\"max-width: 1800px; margin: 0 auto; padding: 46px 26px 6px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 18px; max-width: 900px;\">\n      <p style=\"margin: 0; font-size: 24px; line-height: 1.62; color: #23423B;\">The hospital is staffed by Resident Medical Officers (RMOs) and specialists, including MD Medicine, Gynaecology. Visiting specialists also conduct clinics on designated days of the week. Nursing and paramedical staff provide round-the-clock care and support in the wards, casualty, and operating theatres.<\u002Fp>\n      <p style=\"margin: 0; font-size: 22px; line-height: 1.62; color: #4E5F5A;\">You do not need to request a specific doctor. Simply register at the OPD counter, and our staff will guide you to the doctor on duty based on your medical needs. If required, you will be referred to the appropriate specialist clinic. Consultation with all doctors listed here is provided free of charge. Diagnostic tests, medicines, and hospitalisation, when required, are also provided free of charge.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== SECTION HEAD ===== -->\n  <section style=\"max-width: 1800px; margin: 0 auto; padding: 40px 26px 0;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #E6ECEA; padding-bottom: 16px;\">\n      <span style=\"width: 30px; height: 4px; border-radius: 2px; background: #06A88C; flex: none;\"><\u002Fspan>\n      <h2 style=\"font-weight: 500; font-size: 34px; margin: 0; color: #1F3A34;\">Our Medical <span style=\"font-weight: 700;\">Team<\u002Fspan><\u002Fh2>\n      <span style=\"margin-left: auto; font-size: 19px; font-weight: 600; color: #7A8C87;\">{{ count }}<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 18px 0 0; font-size: 21px; line-height: 1.6; color: #4E5F5A; max-width: 900px;\">Meet our resident medical officers and visiting specialists providing clinical care across the hospital's departments.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ===== FILTERS ===== -->\n  <section style=\"max-width: 1800px; margin: 0 auto; padding: 22px 26px 0;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f.onClick }}\" style=\"border: 1px solid {{ f.border }}; background: {{ f.bg }}; color: {{ f.color }}; font-family: inherit; font-weight: 500; font-size: 19px; padding: 10px 17px; border-radius: 999px; cursor: pointer; transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;\" style-hover=\"border-color: #06A88C;\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== DOCTOR CARDS ===== -->\n  <section id=\"team\" style=\"max-width: 1800px; margin: 0 auto; padding: 28px 26px 20px; scroll-margin-top: 120px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 26px; align-items: start;\">\n      <sc-for list=\"{{ doctors }}\" as=\"d\" hint-placeholder-count=\"10\">\n        <div style=\"background: #ffffff; border: 1px solid #E6ECEA; border-radius: 12px; overflow: hidden; transition: border-color 0.3s ease, box-shadow 0.3s ease;\" style-hover=\"border-color: #BEE3DB; box-shadow: 0 20px 44px -34px rgba(6,120,100,0.5);\">\n          <div style=\"display: grid; grid-template-columns: 1fr; padding: 26px 28px 28px;\">\n            <div>\n              <h3 style=\"font-weight: 600; font-size: 24px; line-height: 1.26; margin: 0 0 6px; color: #12564C; overflow-wrap: break-word;\">{{ d.name }}<\u002Fh3>\n              <div style=\"font-size: 19px; font-weight: 600; color: #0A5F52;\">{{ d.role }}<\u002Fdiv>\n              <div style=\"font-size: 17.5px; color: #7A8C87; margin-top: 3px;\">{{ d.qualification }}<\u002Fdiv>\n              <div style=\"margin-top: 18px; padding-top: 15px; border-top: 1px solid #F1F5F3; display: flex; flex-direction: column; gap: 6px; font-size: 18px; color: #5A6A66;\">\n                <span>{{ d.hours }}<\u002Fspan>\n                <span>{{ d.location }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== SUPPORT TEAM ===== -->\n  <section style=\"background: #F7FBFA; border-top: 1px solid #E6EFEC; margin-top: 44px;\">\n    <div style=\"max-width: 1800px; margin: 0 auto; padding: 46px 26px 50px;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #DCEBE7; padding-bottom: 16px; margin-bottom: 30px;\">\n        <span style=\"width: 30px; height: 4px; border-radius: 2px; background: #45B8CC; flex: none;\"><\u002Fspan>\n        <h2 style=\"font-weight: 500; font-size: 34px; margin: 0; color: #1F3A34;\">Nursing &amp; <span style=\"font-weight: 700;\">Support Staff<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; max-width: 1100px;\">\n        <sc-for list=\"{{ support }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display: grid; grid-template-columns: 90px minmax(0, 280px) 1fr; gap: 26px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid #E1EEEA;\">\n            <div style=\"font-weight: 700; font-size: 24px; color: #0A5F52;\">{{ s.count }}<\u002Fdiv>\n            <h3 style=\"font-weight: 600; font-size: 21px; margin: 0; color: #12564C;\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 19px; line-height: 1.56; color: #4E5F5A;\">{{ s.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== HELP BAND ===== -->\n  <section style=\"max-width: 1800px; margin: 0 auto; padding: 46px 26px 70px;\">\n    <div style=\"background: #F1F8F6; border: 1px solid #E1F3EF; border-radius: 20px; padding: 38px 42px; display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap;\">\n      <div style=\"max-width: 700px;\">\n        <h3 style=\"font-weight: 600; font-size: 27px; margin: 0 0 8px; color: #1F3A34;\">Which doctor should you see?<\u002Fh3>\n        <p style=\"margin: 0; font-size: 20.5px; line-height: 1.6; color: #5A6A66;\">Register at the OPD counter and staff will direct you to the doctor on duty, or tell you which day the specialist clinic you need is held.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"tel:+912168260247\" style=\"display: inline-flex; align-items: center; gap: 10px; background: #06A88C; color: #fff; font-weight: 700; font-size: 19px; padding: 15px 28px; border-radius: 999px; white-space: nowrap;\">Call the hospital<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FLOATING FACILITY BUTTON ===== -->\n  <div style=\"position: fixed; right: 30px; bottom: 30px; z-index: 90; display: flex; flex-direction: column; align-items: flex-end; gap: 14px;\">\n    <sc-if value=\"{{ fabOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width: 316px; max-height: 380px; overflow-y: auto; background: #ffffff; border: 1px solid #E6ECEA; border-radius: 18px; box-shadow: 0 26px 56px -20px rgba(12,70,62,0.45);\">\n        <div style=\"padding: 15px 20px 13px; border-bottom: 1px solid #EEF3F1; display: flex; align-items: center; gap: 9px;\">\n          <span style=\"width: 22px; height: 3px; border-radius: 2px; background: #E1332A;\"><\u002Fspan>\n          <span style=\"font-weight: 700; font-size: 18px; color: #1F3A34;\">Specialities<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ fabLinks }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <a href=\"#team\" sc-camel-on-click=\"{{ m.onClick }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #F1F5F3; font-size: 18px; font-weight: 500; color: #1F3A34;\" style-hover=\"background: #F1F8F6; color: #06A88C;\">\n              <span>{{ m.label }}<\u002Fspan>\n              <span style=\"font-size: 13.5px; font-weight: 600; color: #7A8C87;\">{{ m.count }}<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleFab }}\" aria-expanded=\"{{ fabExpanded }}\" aria-label=\"Browse specialities\" style=\"width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; background: #E1332A; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 34px -10px rgba(225,51,42,0.6);\" style-hover=\"background: #C42A21;\" style-focus=\"outline: 3px solid #F6BDB8; outline-offset: 2px;\">\n      {{ fabIcon }}\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- ===== FOOTER ===== -->\n  <footer style=\"position: relative; background: linear-gradient(122deg, #05917D 0%, #099099 55%, #2FA9BF 100%); color: #DCEDEA;\">\n    <div style=\"position: absolute; top: -1px; left: 0; width: 100%; height: 110px; background: #ffffff; clip-path: ellipse(130% 100% at 50% 0%); z-index: 1;\"><\u002Fdiv>\n    <div style=\"position: relative; z-index: 2; max-width: 1800px; margin: 0 auto; padding: 118px 26px 0;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.26); border-radius: 16px; padding: 22px 28px; margin-bottom: 52px;\">\n        <div style=\"display: flex; align-items: center; gap: 14px;\">\n          <span style=\"width: 12px; height: 12px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 5px rgba(225,51,42,0.5); flex: none;\"><\u002Fspan>\n          <div>\n            <div style=\"font-weight: 700; font-size: 23px; color: #ffffff;\">In an emergency, come straight in.<\u002Fdiv>\n            <div style=\"font-size: 18px; color: #DCEDEA; margin-top: 3px;\">Casualty is open 24 hours, every day. No appointment needed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n          <a href=\"tel:+912168260247\" style=\"display: inline-flex; align-items: center; gap: 10px; background: #E1332A; color: #ffffff; font-weight: 700; font-size: 19px; padding: 13px 24px; border-radius: 999px;\" style-hover=\"background: #C42A21; color: #ffffff;\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"#ffffff\" style=\"flex: none;\"><path d=\"M6.6 2.2c.5-.1 1 .2 1.1.7l1.1 4.6c.1.4-.1.9-.5 1.1L6.4 9.8a13.5 13.5 0 0 0 7.8 7.8l1.2-1.9c.2-.4.7-.6 1.1-.5l4.6 1.1c.5.1.8.6.7 1.1-.5 2.6-2.8 4.4-5.4 4.3C9.1 21.3 2.7 14.9 2.3 7.6 2.2 5 4 2.7 6.6 2.2Z\"><\u002Fpath><\u002Fsvg>+91 21682 60247<\u002Fa>\n          <a href=\"Emergency page updated version.dc.html\" style=\"display: inline-flex; align-items: center; gap: 10px; background: #ffffff; color: #0E7D6B; font-weight: 700; font-size: 19px; padding: 13px 24px; border-radius: 999px;\">Emergency information<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 44px; padding-bottom: 44px;\">\n        <div>\n          <div style=\"font-weight: 700; font-size: 26px; line-height: 1.25; color: #ffffff; margin-bottom: 12px;\">Morarji Gokuldas Rural Hospital<\u002Fdiv>\n          <p style=\"margin: 0 0 18px; font-size: 18.5px; line-height: 1.6; color: #EAF7F4; max-width: 420px;\">A 30-bed government rural hospital in Mahabaleshwar, serving the town, nearby villages and visitors since 1914.<\u002Fp>\n          <p style=\"margin: 0; font-size: 18.5px; line-height: 1.6; color: #EAF7F4;\">All consultations, tests, medicines and stays are free of charge.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight: 600; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #C7EDE6; margin-bottom: 16px;\">Find us<\u002Fdiv>\n          <div style=\"font-size: 18.5px; line-height: 1.6; color: #EAF7F4; margin-bottom: 14px;\">Mahabaleshwar – Medha Road<br>District Satara – 412 806<br>Maharashtra, India<\u002Fdiv>\n          <a href=\"Contact us page updated version.dc.html\" style=\"font-size: 18px; font-weight: 600; color: #ffffff; text-decoration: underline; text-underline-offset: 4px;\">Get directions<\u002Fa>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight: 600; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #C7EDE6; margin-bottom: 16px;\">Opening hours<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 18.5px; line-height: 1.5; color: #EAF7F4;\">\n            <div><span style=\"font-weight: 600; color: #ffffff;\">OPD<\u002Fspan><br>09:00 am – 01:00 pm<br>04:00 pm – 06:00 pm<\u002Fdiv>\n            <div><span style=\"font-weight: 600; color: #ffffff;\">Casualty<\u002Fspan><br>Open 24 hours<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight: 600; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #C7EDE6; margin-bottom: 16px;\">Explore<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <a href=\"Facilities (V1) update version.dc.html\" style=\"font-size: 18.5px; color: #EAF7F4;\" style-hover=\"color: #ffffff;\">Facilities<\u002Fa>\n            <a href=\"Doctors page updated version.dc.html\" style=\"font-size: 18.5px; color: #EAF7F4;\" style-hover=\"color: #ffffff;\">Doctors<\u002Fa>\n            <a href=\"Programmes page updated version.dc.html\" style=\"font-size: 18.5px; color: #EAF7F4;\" style-hover=\"color: #ffffff;\">Programmes<\u002Fa>\n            <a href=\"Event page updated version.dc.html\" style=\"font-size: 18.5px; color: #EAF7F4;\" style-hover=\"color: #ffffff;\">Camps &amp; Events<\u002Fa>\n            <a href=\"Support us page updated version.dc.html\" style=\"font-size: 18.5px; color: #EAF7F4;\" style-hover=\"color: #ffffff;\">Support Us<\u002Fa>\n            <a href=\"Contact us page updated version.dc.html\" style=\"font-size: 18.5px; color: #EAF7F4;\" style-hover=\"color: #ffffff;\">Contact<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid rgba(255,255,255,0.3); padding: 20px 0 26px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 17px; color: #D3EDE8;\">\n        <span>© 2026 Morarji Gokuldas Rural Hospital, Mahabaleshwar<\u002Fspan>\n        <a href=\"mailto:info@mgrh-mahabaleshwar.org\" style=\"color: #D3EDE8;\" style-hover=\"color: #ffffff;\">info@mgrh-mahabaleshwar.org<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1800}}\">\nclass Component extends DCLogic {\n  state = { headerH: 107, fabOpen: false, filter: 'All doctors' };\n  headerRef = React.createRef();\n\n  componentDidMount() {\n    const measure = () => {\n      const el = this.headerRef.current;\n      if (!el) return;\n      const hh = Math.round(el.getBoundingClientRect().height);\n      if (hh && hh !== this.state.headerH) this.setState({ headerH: hh });\n    };\n    measure();\n    if (typeof ResizeObserver !== 'undefined' && this.headerRef.current) {\n      this._ro = new ResizeObserver(measure);\n      this._ro.observe(this.headerRef.current);\n    }\n    // Live data: the store may arrive after first paint (e.g. fetched from Supabase).\n    // Re-render as soon as it exists, and again whenever it changes.\n    const hook = () => {\n      const S = window.MGRHStore;\n      if (!S) return false;\n      if (S.subscribe && !this._unsub) this._unsub = S.subscribe(() => this.forceUpdate());\n      this.forceUpdate();\n      return true;\n    };\n    if (!hook()) {\n      this._poll = setInterval(() => { if (hook()) clearInterval(this._poll); }, 150);\n      setTimeout(() => clearInterval(this._poll), 15000);\n    }\n  }\n  componentWillUnmount() {\n    if (this._ro) this._ro.disconnect();\n    clearInterval(this._poll);\n    if (this._unsub) this._unsub();\n  }\n\n  renderVals() {\n    const fallback = [\n      { name: 'Dr. Pandit Kishanrao Deshmukh', role: 'Medical Superintendent', speciality: 'Medicine',\n        qualification: 'M.B.B.S., D.P.H., M.D. (Medicine) · 49 years experience',\n        bio: 'Heads the hospital and its outpatient department, and oversees the medical team across all fourteen departments.',\n        hours: 'OPD, Monday to Saturday, 9:00 – 13:00', location: 'OPD block, first floor' },\n      { name: 'Dr. Jeetendrasingh Jalimsingh Rajput', role: 'Gynecologist', speciality: 'Surgery',\n        qualification: 'M.D. Obstetrics & Gynaecology · 32 years experience',\n        bio: 'Runs the antenatal clinic and supervises deliveries in the labour room, with postnatal follow-up for mother and newborn.',\n        hours: 'ANC clinic, Tuesday and Friday, 10:00 – 14:00', location: 'Maternity block' },\n      { name: 'Dr. Nikita Viraj Yerramalla', role: 'Pediatrician', speciality: 'Pediatrics',\n        qualification: 'M.B.B.S. DCH · 7 years experience',\n        bio: 'Sees infants and children in the paediatric ward and at the Mother and Child Health Clinic, and supervises immunisation days.',\n        hours: 'Paediatric clinic, Monday and Thursday, 10:00 – 13:00', location: 'Paediatric ward' },\n      { name: 'Dr. Sunil Tukaram Pise', role: 'Orthopedist', speciality: 'Orthopedics',\n        qualification: 'M.B.B.S. DNB · 28 years experience',\n        bio: 'Treats fractures, joint and bone conditions, and performs orthopaedic procedures in the renovated operation theatres.',\n        hours: 'Orthopaedic clinic, Wednesday and Saturday', location: 'OPD block and operation theatre' },\n      { name: 'Dr. Aruna Prashant Rasal', role: 'Dr. Consultant (Anaesthetist)', speciality: 'Anaesthesia',\n        qualification: 'M.B.B.S. DA · 26 years experience',\n        bio: 'Provides anaesthesia for surgical and obstetric procedures and supports monitoring in the intensive care unit.',\n        hours: 'On call for operating lists', location: 'Operation theatre and ICU' },\n      { name: 'Dr. Dhimant Harischandra Kambley', role: 'M. O. Dentist', speciality: 'Dental Surgeon',\n        qualification: 'B.D.S. · 32 years experience',\n        bio: 'Treats tooth and gum complaints at the dental clinic, including extractions, fillings and school dental checks.',\n        hours: 'Dental clinic, Monday to Friday, 10:00 – 15:00', location: 'Dental clinic, ground floor' },\n      { name: 'Dr. Chandrashekhar Vaman Lele', role: 'Dr. Consultant (Intensivist)', speciality: 'General',\n        qualification: 'M.B.B.S. · 48 years experience',\n        bio: 'Leads care in the intensive care unit, managing critically ill patients and advising on casualty admissions.',\n        hours: 'ICU, daily rounds and on call', location: 'Intensive Care Unit' },\n      { name: 'Dr. Mohammed Kashid Mohammed Hashim Khokar', role: 'Medical Officer', speciality: 'General',\n        qualification: 'M.B.B.S. · 4 years experience',\n        bio: 'On duty for casualty admissions and general consultations, and coordinates transfers when specialist care is needed.',\n        hours: 'Casualty, rotating shifts, 24 hours', location: 'Casualty ward, ground floor' },\n      { name: 'Dr. Ashish Ashok Rai', role: 'Medical Officer', speciality: 'General',\n        qualification: 'M.B.B.S. · 2 years experience',\n        bio: 'Sees patients at the general OPD and in the wards, and covers casualty shifts on rotation.',\n        hours: 'OPD and casualty, rotating shifts', location: 'OPD block and casualty' },\n      { name: 'Dr. Suyash Nanasaheb Deshmukh', role: 'Medical Officer', speciality: 'General',\n        qualification: 'M.B.B.S. · 6 months experience',\n        bio: 'Supports the general OPD and ward rounds, and joins casualty and night duty on rotation.',\n        hours: 'OPD and casualty, rotating shifts', location: 'OPD block and casualty' },\n    ];\n    // Published doctors come from the Content Manager; the list above is the fallback if it can't load.\n    const S = window.MGRHStore;\n    const cmsDocs = S ? S.published('doctors') : [];\n    const all = cmsDocs.length ? cmsDocs.map(d => ({\n      name: d.name, role: d.designation, speciality: d.speciality,\n      qualification: [d.qualifications, d.experience && d.experience + ' experience'].filter(Boolean).join(' · '),\n      bio: d.bio,\n      hours: d.schedule || [(d.days || []).join(', '), d.start && d.end ? d.start + ' – ' + d.end : ''].filter(Boolean).join(', '),\n      location: d.location, photo: S.mediaSrc(d.imageId),\n    })) : fallback;\n\n    const cats = ['All doctors', 'Medicine', 'Surgery', 'Pediatrics', 'Orthopedics', 'Anaesthesia', 'Dental Surgeon', 'General'];\n    const filter = this.state.filter;\n    const shown = filter === 'All doctors' ? all : all.filter(d => d.speciality === filter);\n\n    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\n\n    const ce = React.createElement;\n    const fo = this.state.fabOpen;\n    const fabIcon = fo\n      ? ce('svg', { width: 26, height: 26, viewBox: '0 0 24 24', fill: 'none', stroke: '#ffffff', strokeWidth: 2.2, strokeLinecap: 'round' },\n          ce('path', { d: 'M6 6l12 12M18 6L6 18' }))\n      : ce('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: '#ffffff', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, [\n          ce('path', { key: 1, d: 'M4 21V9.4a1 1 0 0 1 .55-.9L11.5 5a1 1 0 0 1 .9 0l7.05 3.5a1 1 0 0 1 .55.9V21' }),\n          ce('path', { key: 2, d: 'M2.5 21h19' }),\n          ce('path', { key: 3, d: 'M12 9.6v5.2M9.4 12.2h5.2', strokeWidth: 2.1 }),\n          ce('path', { key: 4, d: 'M9.6 21v-3.1h4.8V21' }),\n        ]);\n\n    return {\n      headerRef: this.headerRef,\n      count: all.length + ' doctors',\n      heroFacts: [\n        { value: '10', label: 'doctors and specialists' },\n        { value: '24 hrs', label: 'casualty and nursing cover' },\n        { value: 'Free', label: 'every consultation and test' },\n      ],\n      filters: cats.map(c => {\n        const on = c === filter;\n        return {\n          label: c,\n          onClick: () => this.setState({ filter: c }),\n          bg: on ? '#06A88C' : '#ffffff',\n          color: on ? '#ffffff' : '#1F3A34',\n          border: on ? '#06A88C' : '#D2E8E3',\n        };\n      }),\n      doctors: shown.map(d => {\n        return { ...d };\n      }),\n      support: [\n        { count: '15', title: 'Nursing staff', desc: 'Ward, casualty and theatre nursing cover in rotating shifts, day and night.' },\n        { count: '10', title: 'Paramedical staff', desc: 'Laboratory technicians, radiographers and pharmacy staff supporting diagnostics and dispensing.' },\n        { count: '9', title: 'Health workers', desc: 'ANMs and community health workers running village clinics, immunisation booths and home visits.' },\n        { count: '16', title: 'Administration & housekeeping', desc: 'The hospital is supported by administrative staff, registration and records staff, ambulance drivers, and housekeeping staff who help keep the hospital running smoothly.' },\n      ],\n      fabIcon,\n      fabOpen: fo,\n      fabExpanded: fo ? 'true' : 'false',\n      toggleFab: () => this.setState(s => ({ fabOpen: !s.fabOpen })),\n      fabLinks: cats.slice(1).map(c => ({\n        label: c,\n        count: all.filter(d => d.speciality === c).length,\n        onClick: () => this.setState({ fabOpen: false, filter: c }),\n      })),\n      nav: [\n        { label: 'Home', color: '#3A4744', href: 'Home page.dc.html' },\n        { label: 'About Us', color: '#3A4744', href: 'About us page V2.dc.html' },\n        { label: 'Services', color: '#3A4744', href: 'Facilities (V1).dc.html' },\n        { label: 'Doctors', color: '#06A88C', href: '#team' },\n        { label: 'Programmes', color: '#3A4744', href: 'Programmes page.dc.html' },\n        { label: 'Events', color: '#3A4744', href: 'Event page.dc.html' },\n        { label: 'Support Us', color: '#3A4744', href: '#' },\n        { label: 'Contact', color: '#3A4744', href: 'tel:+912168260247' },\n      ],\n      footCols: [\n        { head: 'Explore', items: ['Home', 'About Us', 'Doctors', 'Programmes', 'Facilities'] },\n        { head: 'Emergency', items: ['Casualty Ward', 'Intensive Care Unit', 'Ambulance service'] },\n        { head: 'Diagnostics', items: ['Pathology Lab', 'X-ray', 'Sonography', '2D Echo'] },\n        { head: 'Visit', items: ['Mahabaleshwar - Medha Road', 'District - Satara – 412 806', 'Maharashtra, India', '+91 21682 60247', 'E: info@mgrh-mahabaleshwar.org'] },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
